name: pr-validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate changed fragment JSON
        run: node scripts/validate-fragments.mjs

      - name: Validate lexicons and fragment cross-links
        run: node scripts/validate-lexicon.mjs

      - name: Validate manuscript registry and bible coverage
        run: node scripts/validate-manuscripts.mjs

      - name: Validate search metadata and relevance fixtures
        run: |
          node scripts/validate-search-metadata.mjs
          node scripts/test_search.mjs

      - name: Validate official photograph links
        run: node scripts/validate-photo-links.mjs

      - name: Validate first-draft translation packs
        run: node scripts/validate-translations.mjs

      - name: Validate translation queue
        run: node scripts/validate-translation-queue.mjs

      - name: Post trust badge stub
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="Trust badge: reputation lookup is not wired to D1 yet. Author @${{ github.event.pull_request.user.login }} will be scored once the GitHub App and D1 sync exist."
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -f body="$body"
